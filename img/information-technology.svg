<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="rack">
      <rect x="-40" y="-220" width="80" height="220" rx="3"/>
      <path d="M-40 -190H40 M-40 -160H40 M-40 -130H40 M-40 -100H40 M-40 -70H40 M-40 -40H40 M-40 -10H40"/>
      <circle cx="28" cy="-205" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="28" cy="-175" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="28" cy="-145" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="28" cy="-115" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="28" cy="-85" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="28" cy="-55" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="28" cy="-25" r="2.4" fill="currentColor" stroke="none"/>
    </g>
    <g id="node"><circle r="6"/></g>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0fb" stop-opacity="1"/>
      <stop offset="1" stop-color="#eef0fb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- faint circuit-board mesh across the whole scene -->
  <g fill="none" stroke="#1c2233" stroke-opacity=".05" stroke-width="1.2">
    <path d="M0 120H320V220H620V90H920V300H1220V180H1600"/>
    <path d="M100 120V40H260 M480 220V500 M760 90V20H1040 M1080 300V420H1360 M1500 180V60"/>
    <circle cx="100" cy="40" r="4"/><circle cx="480" cy="500" r="4"/><circle cx="1040" cy="20" r="4"/>
    <circle cx="1360" cy="420" r="4"/><circle cx="1500" cy="60" r="4"/><circle cx="260" cy="40" r="4"/>
  </g>

  <!-- network mesh, node graph mid-ground -->
  <g fill="none" stroke="#1c2233" stroke-opacity=".14" stroke-width="1.4">
    <path d="M250 420 L470 360 L700 430 L950 350 L1180 415 L1400 355"/>
    <path d="M470 360 L620 260 M700 430 L620 260 M950 350 L1080 250 M1180 415 L1080 250 M1400 355 L1300 260"/>
  </g>
  <g fill="#1c2233" fill-opacity=".22" stroke="none">
    <use href="#node" transform="translate(250 420)"/><use href="#node" transform="translate(470 360)"/>
    <use href="#node" transform="translate(700 430)"/><use href="#node" transform="translate(620 260)"/>
    <use href="#node" transform="translate(950 350)"/><use href="#node" transform="translate(1080 250)"/>
    <use href="#node" transform="translate(1180 415)"/><use href="#node" transform="translate(1400 355)"/>
    <use href="#node" transform="translate(1300 260)"/>
  </g>

  <!-- cloud, upper right, with dashed sync lines down to the racks -->
  <g fill="none" stroke="#1c2233" stroke-opacity=".3" stroke-width="2">
    <path d="M1140 150c-8-26-32-44-60-44-22 0-41 12-51 30-4-2-9-3-14-3-20 0-36 16-36 36 0 3 0 6 1 9-16 4-28 19-28 37 0 21 17 38 38 38h150c23 0 42-19 42-42 0-20-14-37-33-41 2-6 3-13 3-20 0-14-5-27-12-19"/>
  </g>
  <g fill="none" stroke="#1c2233" stroke-opacity=".22" stroke-width="1.4" stroke-dasharray="3 6">
    <path d="M1060 232 L860 420 M1000 232 L580 420 M1000 232 L1300 420"/>
  </g>

  <!-- laptop, clear of the racks, connected back to the mesh -->
  <g fill="none" stroke="#1c2233" stroke-opacity=".32" stroke-width="2" transform="translate(700 590)">
    <rect x="-46" y="-30" width="92" height="58" rx="3"/>
    <path d="M-46 8H46 M-58 28H58 L46 8H-46Z"/>
    <path d="M-32 -18H32 M-32 -6H14"/>
  </g>
  <path d="M700 560 L700 430" fill="none" stroke="#1c2233" stroke-opacity=".22" stroke-width="1.4" stroke-dasharray="3 6"/>

  <!-- small padlock on one link, hinting at a secured / VPN connection -->
  <g fill="none" stroke="#1c2233" stroke-opacity=".38" stroke-width="2" transform="translate(760 340)">
    <rect x="-11" y="-2" width="22" height="18" rx="2"/>
    <path d="M-7 -2v-8a7 7 0 0 1 14 0v8"/>
  </g>

  <!-- server racks, foreground -->
  <g fill="none" stroke="#1c2233" stroke-opacity=".5" stroke-width="2" color="#1c2233" transform="translate(150 640)">
    <use href="#rack"/>
  </g>
  <g fill="none" stroke="#1c2233" stroke-opacity=".55" stroke-width="2.2" color="#1c2233" transform="translate(300 640) scale(1.15)">
    <use href="#rack"/>
  </g>
  <g fill="none" stroke="#1c2233" stroke-opacity=".5" stroke-width="2" color="#1c2233" transform="translate(450 640)">
    <use href="#rack"/>
  </g>
  <path d="M150 420 V460 M300 388 V440 M450 420 V460" fill="none" stroke="#1c2233" stroke-opacity=".3" stroke-width="1.6"/>

  <g fill="none" stroke="#1c2233" stroke-opacity=".48" stroke-width="2" color="#1c2233" transform="translate(1230 640) scale(1.1)">
    <use href="#rack"/>
  </g>
  <g fill="none" stroke="#1c2233" stroke-opacity=".42" stroke-width="1.8" color="#1c2233" transform="translate(1370 640) scale(.9)">
    <use href="#rack"/>
  </g>

  <!-- floor line -->
  <path d="M0 638H1600" fill="none" stroke="#1c2233" stroke-opacity=".2" stroke-width="1.4"/>

  <rect x="0" y="0" width="1600" height="230" fill="url(#fade)"/>
</svg>
