<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6f0" stop-opacity="1"/>
      <stop offset="1" stop-color="#eef6f0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- faint medical-chart cross pattern, background -->
  <g fill="none" stroke="#1c2b23" stroke-opacity=".05" stroke-width="1.4">
    <path d="M120 100v24M108 112h24 M420 220v24M408 232h24 M760 80v24M748 92h24
             M1080 200v24M1068 212h24 M1360 110v24M1348 122h24 M220 460v24M208 472h24
             M1480 380v24M1468 392h24"/>
  </g>

  <!-- heartbeat / ECG line running through the whole scene -->
  <path d="M0 330 H520 L560 330 L590 230 L625 420 L655 280 L680 330 H1020 L1055 330
           L1085 240 L1120 400 L1150 300 L1175 330 H1600"
        fill="none" stroke="#1f9d5c" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="590" cy="230" r="5" fill="#1f9d5c" fill-opacity=".55"/>

  <!-- ground line -->
  <path d="M0 560H1600" fill="none" stroke="#1c2b23" stroke-opacity=".18" stroke-width="1.4"/>

  <!-- hospital building, left -->
  <g fill="none" stroke="#1c2b23" stroke-opacity=".5" stroke-width="2.2" transform="translate(150 560)">
    <rect x="-140" y="-260" width="280" height="260"/>
    <rect x="-110" y="-220" width="220" height="30" opacity=".9"/>
    <!-- cross on facade -->
    <path d="M-15 -195 h30 M0 -210 v30" stroke-width="4"/>
    <!-- window grid -->
    <path d="M-110 -150 h220 M-110 -110 h220 M-110 -70 h220 M-110 -30 h220
             M-70 -170 v150 M-10 -170 v150 M50 -170 v150 M-140 -170 h280"/>
    <!-- entrance canopy -->
    <rect x="-45" y="-40" width="90" height="40"/>
    <path d="M-60 -40 h120" stroke-width="3"/>
  </g>

  <!-- ambulance, right -->
  <g fill="none" stroke="#1c2b23" stroke-opacity=".5" stroke-width="2.2" transform="translate(1290 560)">
    <path d="M-160 0 V-70 H-120 L-95 -105 H90 V-70 H120 V0 Z"/>
    <path d="M-95 -105 V-70 M-40 -105 V-70 M-40 -70 H90"/>
    <circle cx="-95" cy="8" r="24"/>
    <circle cx="70" cy="8" r="24"/>
    <!-- cross on side panel -->
    <path d="M-15 -55 h30 M0 -70 v30" stroke-width="4"/>
    <!-- light bar -->
    <rect x="-70" y="-118" width="50" height="10" rx="2"/>
  </g>

  <rect x="0" y="0" width="1600" height="230" fill="url(#fade)"/>
</svg>
