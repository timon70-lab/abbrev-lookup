<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- One lattice pylon, drawn once and reused at different scales -->
    <g id="pylon" fill="none" stroke="#1a2328" stroke-width="2.2" stroke-linejoin="round">
      <path d="M-34 0 L-12 -190 L12 -190 L34 0"/>
      <path d="M-30 -20 H30 M-27 -50 H27 M-24 -80 H24 M-21 -110 H21 M-18 -140 H18 M-15 -170 H15"/>
      <path d="M-30 -20 L27 -50 M30 -20 L-27 -50 M-27 -50 L24 -80 M27 -50 L-24 -80 M-24 -80 L21 -110 M24 -80 L-21 -110 M-21 -110 L18 -140 M21 -110 L-18 -140 M-18 -140 L15 -170 M18 -140 L-15 -170"/>
      <path d="M-62 -128 H62 M-52 -160 H52 M-12 -190 L0 -212 L12 -190"/>
      <path d="M-62 -128 L-40 -110 M62 -128 L40 -110 M-52 -160 L-32 -145 M52 -160 L32 -145"/>
      <path d="M-58 -128 v10 M58 -128 v10 M-48 -160 v10 M48 -160 v10" stroke-width="3"/>
    </g>
    <g id="turbine" fill="none" stroke="#1a2328" stroke-width="2" stroke-linecap="round">
      <path d="M-3 0 L-1.5 -120 H1.5 L3 0Z"/>
      <circle cx="0" cy="-122" r="4"/>
      <path d="M0 -122 L-2 -178 M0 -122 L48 -94 M0 -122 L-46 -96"/>
    </g>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f5f4" stop-opacity="1"/>
      <stop offset="1" stop-color="#f3f5f4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- distant ridge -->
  <path d="M0 470 C200 430 320 420 480 445 S780 500 980 450 S1350 400 1600 440 V640 H0Z" fill="#1a2328" opacity=".045"/>
  <!-- near ridge -->
  <path d="M0 540 C150 520 300 505 460 520 S760 560 940 530 S1300 490 1600 525 V640 H0Z" fill="#1a2328" opacity=".06"/>

  <!-- far pylons and lines, small -->
  <g opacity=".22">
    <use href="#pylon" transform="translate(120 470) scale(.55)"/>
    <use href="#pylon" transform="translate(430 455) scale(.55)"/>
    <use href="#pylon" transform="translate(740 470) scale(.55)"/>
    <use href="#pylon" transform="translate(1050 452) scale(.55)"/>
    <use href="#pylon" transform="translate(1360 462) scale(.55)"/>
    <path fill="none" stroke="#1a2328" stroke-width="1.2"
      d="M86 400 Q275 425 396 385 M154 400 Q275 425 464 385
         M396 385 Q585 410 706 400 M464 385 Q585 410 774 400
         M706 400 Q895 425 1016 382 M774 400 Q895 425 1084 382
         M1016 382 Q1205 410 1326 392 M1084 382 Q1205 410 1394 392"/>
  </g>

  <!-- near pylons, large -->
  <g opacity=".35">
    <use href="#pylon" transform="translate(300 600) scale(1.05)"/>
    <use href="#pylon" transform="translate(900 610) scale(1.05)"/>
    <use href="#pylon" transform="translate(1500 600) scale(1.05)"/>
    <path fill="none" stroke="#1a2328" stroke-width="1.6"
      d="M-100 440 Q100 480 235 466 M-100 480 Q100 520 245 500
         M239 466 Q570 530 839 476 M361 466 Q570 530 961 476
         M249 500 Q570 565 849 510 M351 500 Q570 565 951 510
         M839 476 Q1170 530 1439 466 M961 476 Q1170 530 1561 466
         M849 510 Q1170 565 1449 500 M951 510 Q1170 565 1551 500
         M1439 466 Q1600 490 1700 470 M1449 500 Q1600 525 1700 505"/>
  </g>

  <!-- wind turbines on the ridge -->
  <g opacity=".28">
    <use href="#turbine" transform="translate(600 505) scale(.8)"/>
    <use href="#turbine" transform="translate(660 512) scale(.62) rotate(0)"/>
    <use href="#turbine" transform="translate(1200 498) scale(.9)"/>
  </g>

  <!-- substation, foreground right -->
  <g fill="none" stroke="#1a2328" stroke-width="2.4" opacity=".38" transform="translate(1060 610)">
    <path d="M0 0 H300"/>
    <!-- transformer -->
    <rect x="20" y="-70" width="70" height="70" rx="4"/>
    <path d="M30 -70 V-90 M45 -70 V-90 M60 -70 V-90 M75 -70 V-90 M28 -84 H77"/>
    <path d="M30 -55 H80 M30 -40 H80 M30 -25 H80"/>
    <!-- disconnect / insulator strings -->
    <path d="M130 0 V-110 M160 0 V-110 M190 0 V-110 M120 -110 H200"/>
    <path d="M130 -110 L160 -140 L190 -110"/>
    <path d="M145 -116 h6 M175 -116 h6"/>
    <!-- circuit breaker -->
    <rect x="230" y="-55" width="50" height="55" rx="3"/>
    <path d="M245 -55 V-95 M265 -55 V-95 M240 -95 H270"/>
    <!-- fence -->
    <path d="M-10 -30 H310" stroke-dasharray="4 5" stroke-width="1.4"/>
  </g>

  <!-- soften top so text sits cleanly -->
  <rect x="0" y="0" width="1600" height="300" fill="url(#fade)"/>
</svg>
