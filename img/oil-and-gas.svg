<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a26" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b131c" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2733" stop-opacity="1"/>
      <stop offset="1" stop-color="#1d2733" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx=".5" cy=".9" r=".6">
      <stop offset="0" stop-color="#ffb066" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#e8642a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e8642a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- water column -->
  <rect x="0" y="330" width="1600" height="310" fill="url(#sea)"/>
  <!-- surface -->
  <path d="M0 330 H1600" stroke="#eef1f4" stroke-opacity=".35" stroke-width="1.2"/>
  <path fill="none" stroke="#eef1f4" stroke-opacity=".08" stroke-width="1"
        d="M0 350 Q40 344 80 350 T160 350 T240 350 T320 350 T400 350 T480 350 T560 350 T640 350 T720 350 T800 350 T880 350 T960 350 T1040 350 T1120 350 T1200 350 T1280 350 T1360 350 T1440 350 T1520 350 T1600 350
           M0 372 Q40 366 80 372 T160 372 T240 372 T320 372 T400 372 T480 372 T560 372 T640 372 T720 372 T800 372 T880 372 T960 372 T1040 372 T1120 372 T1200 372 T1280 372 T1360 372 T1440 372 T1520 372 T1600 372"/>

  <!-- shuttle tanker on the horizon, far left -->
  <g fill="none" stroke="#eef1f4" stroke-opacity=".3" stroke-width="1.6" transform="translate(170 330)">
    <path d="M-90 0 L-80 -14 H70 L84 0Z"/>
    <path d="M40 -14 V-34 H66 V-14 M52 -34 V-42"/>
    <path d="M-70 -14 V-20 H30 V-14"/>
  </g>

  <!-- platform: jacket legs into the sea, topsides, flare boom -->
  <g fill="none" stroke="#eef1f4" stroke-opacity=".5" stroke-width="2.2" stroke-linejoin="round" transform="translate(900 330)">
    <!-- jacket (legs continue below surface, dimmer) -->
    <path d="M-120 0 L-100 -110 M120 0 L100 -110 M-40 0 L-33 -110 M40 0 L33 -110"/>
    <path d="M-115 -30 H115 M-108 -70 H108 M-120 0 L-33 -110 M-40 0 L-100 -110 M40 0 L100 -110 M120 0 L33 -110"/>
    <g stroke-opacity=".35" stroke-dasharray="none">
      <path d="M-120 0 L-150 200 M120 0 L150 200 M-40 0 L-55 200 M40 0 L55 200 M-136 90 H136 M-148 180 H148 M-150 200 H150"/>
      <path d="M-120 0 L-55 90 M-40 0 L-136 90 M40 0 L136 90 M120 0 L55 90"/>
    </g>
    <!-- deck -->
    <path d="M-150 -110 H150 V-126 H-150Z"/>
    <!-- modules -->
    <rect x="-140" y="-186" width="90" height="60"/>
    <rect x="-40" y="-176" width="70" height="50"/>
    <path d="M-40 -150 H30 M-25 -176 V-126 M0 -176 V-126"/>
    <!-- living quarters + helideck -->
    <rect x="40" y="-200" width="70" height="74"/>
    <path d="M45 -190 H105 M45 -180 H105 M45 -170 H105 M45 -160 H105 M45 -150 H105 M45 -140 H105"/>
    <path d="M30 -204 H120 M75 -204 V-200"/>
    <!-- derrick -->
    <path d="M-105 -186 L-95 -300 H-75 L-65 -186 M-100 -220 H-70 M-97 -250 H-73 M-95 -280 H-75 M-100 -220 L-73 -250 M-70 -220 L-97 -250 M-97 -250 L-75 -280 M-73 -250 L-95 -280"/>
    <!-- crane -->
    <path d="M-20 -176 L-20 -230 L60 -300 M-20 -230 L10 -230 M60 -300 V-260"/>
    <!-- flare boom -->
    <path d="M150 -126 L300 -220 M150 -110 L300 -220 M160 -150 L300 -220" stroke-opacity=".45"/>
  </g>
  <!-- flame -->
  <ellipse cx="1204" cy="90" rx="34" ry="52" fill="url(#flare)"/>
  <path d="M1200 118 C1186 100 1190 82 1200 68 C1206 82 1218 88 1212 106 C1220 98 1224 90 1222 78 C1236 96 1226 124 1200 126Z" fill="#e8642a" opacity=".55"/>

  <!-- subsea: seabed, wellheads, flowlines, riser -->
  <g fill="none" stroke="#eef1f4" stroke-opacity=".28" stroke-width="1.8">
    <path d="M0 560 C150 552 260 566 420 558 S760 540 1000 556 S1380 570 1600 552" stroke-opacity=".35"/>
    <!-- riser from platform to seabed manifold -->
    <path d="M880 330 C870 420 850 480 800 530 Q790 545 780 552"/>
    <!-- manifold -->
    <rect x="740" y="540" width="80" height="16" rx="2"/>
    <!-- flowlines to wellheads -->
    <path d="M740 548 C650 546 560 552 480 550 M820 548 C920 548 1020 556 1130 552"/>
    <!-- wellheads (christmas trees) -->
    <g id="xt"><path d="M-14 0 H14 V-22 H-14Z M0 -22 V-38 M-8 -30 H8 M-14 -8 H-22 M14 -8 H22"/></g>
    <use href="#xt" transform="translate(480 552)"/>
    <use href="#xt" transform="translate(380 556)"/>
    <use href="#xt" transform="translate(1130 552)"/>
    <use href="#xt" transform="translate(1240 556)"/>
    <path d="M380 552 H480 M1130 550 H1240"/>
    <!-- well bores -->
    <path d="M480 552 V640 M380 556 V640 M1130 552 V640 M1240 556 V640" stroke-dasharray="3 6" stroke-opacity=".18"/>
    <!-- rock strata -->
    <path d="M0 600 C300 590 600 612 900 598 S1400 590 1600 604 M0 630 C300 622 700 638 1000 626 S1400 620 1600 634" stroke-opacity=".12"/>
  </g>

  <!-- soften top so text sits cleanly -->
  <rect x="0" y="0" width="1600" height="220" fill="url(#fade)"/>
</svg>
