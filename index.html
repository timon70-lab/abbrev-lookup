<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2328" id="theme-color-meta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abbrev">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Abbrev — what does that stand for?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Neutral defaults. Each sector overrides these via a theme (see SECTORS in the script). */
  :root {
    --paper: #f7f8f6;
    --ink: #1c2126;
    --ink-soft: #5c6670;
    --line: #d5dad8;
    --live: #d4880f;
    --live-soft: #fbf1dd;
    --live-ink: #6b4406;
    --field: #ffffff;
    --texture: none;
    --font: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); transition: background-color .5s ease; }
  /* Prevent iOS Safari auto-zoom: any focusable control needs a >=16px font. */
  input, select, button { font-size: 16px; }
  /* body stays transparent so the fixed scene layer (z-index -1) shows through. */
  body { margin: 0; background: transparent; color: var(--ink); font-family: var(--font);
         display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; position: relative;
         transition: color .5s ease; -webkit-tap-highlight-color: transparent; }
  /* Sector scene sits behind everything, fades in/out on sector change. */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
                 background: var(--texture); transition: opacity .5s ease; }
  body.switching::before { opacity: 0; }

  main { width: min(680px, 100% - 2.5rem); margin: 0 auto; flex: 1;
         padding: max(4.5rem, env(safe-area-inset-top) + 2rem) 0 calc(3rem + env(safe-area-inset-bottom)); }

  h1.title { font-size: 1.9rem; font-weight: 700; margin: 0 0 .4rem; text-align: center; color: var(--ink); }
  .subtitle { font-size: 1.05rem; font-weight: 400; margin: 0 0 2.2rem; text-align: center; color: var(--ink-soft); }

  /* Search: the hero. One tall field, sector selector fused to its right edge. */
  .search { display: flex; border: 1.5px solid var(--line); border-radius: 12px; background: var(--field); overflow: hidden; transition: background-color .5s ease, border-color .5s ease; }
  .search:focus-within { border-color: var(--ink); }
  .search input {
    flex: 1; min-width: 0; min-height: 3.2rem; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 2rem; font-weight: 500; letter-spacing: .01em; color: var(--ink);
    padding: .7rem 1.1rem; text-transform: uppercase; transition: color .5s ease;
  }
  .search input::placeholder { color: var(--ink-soft); opacity: .6; text-transform: none; font-weight: 400; }
  .search .go {
    border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center;
    min-width: 3rem; padding: 0 .5rem;
  }
  .search .go:hover, .search .go:focus-visible { color: var(--live); outline: none; }
  .search select {
    border: 0; border-left: 1.5px solid var(--line); outline: 0; background: transparent;
    font: inherit; font-size: .95rem; color: var(--ink-soft); padding: 0 1rem; cursor: pointer;
    max-width: 44%; min-height: 3.2rem; transition: border-color .5s ease;
  }
  .search select:focus { color: var(--ink); background: var(--paper); }
  .search select option { color: #1c2126; background: #ffffff; }

  .search-wrap { position: relative; }
  .suggestions {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin: 0; padding: .3rem;
    list-style: none; background: var(--field); border: 1.5px solid var(--line); border-top: 0;
    border-radius: 0 0 12px 12px; box-shadow: 0 14px 28px rgba(0,0,0,.14); max-height: 60vh; overflow-y: auto;
  }
  .suggestions li button {
    all: unset; display: flex; align-items: baseline; gap: .5rem; width: 100%; box-sizing: border-box;
    padding: .55rem .7rem; border-radius: 8px; cursor: pointer; font-family: var(--font);
  }
  .suggestions li button .s-abbr { font-weight: 600; letter-spacing: .01em; color: var(--ink); }
  .suggestions li button .s-gist { font-size: .85rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggestions li button:hover, .suggestions li button.active { background: var(--live-soft); }

  .hint { margin: .8rem .2rem 0; font-size: .85rem; color: var(--ink-soft); }
  .hint button { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: .3rem 0; display: inline-block; }
  .hint button:focus-visible { outline: 2px solid var(--live); border-radius: 2px; }

  /* Result reads like a glossary entry, not a card. */
  #result { margin-top: 3rem; }
  .entry { border-top: 3px solid var(--live); padding-top: 1.2rem; }
  .entry .full { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin: 0; }
  .entry .abbr { font-weight: 500; color: var(--ink-soft); margin: .15rem 0 1.1rem; }
  .entry .gist { font-size: 1.2rem; font-weight: 500; line-height: 1.35; margin: 0 0 .6rem; max-width: 40ch; color: var(--live-ink); }
  .entry p.desc { font-size: 1.05rem; line-height: 1.55; margin: 0; max-width: 62ch; }
  .term-link { all: unset; cursor: pointer; color: inherit; text-decoration: underline;
               text-decoration-color: var(--live); text-underline-offset: 2px; font: inherit; }
  .term-link:hover, .term-link:focus-visible { color: var(--live-ink); outline: none; }
  .note-btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
              width: 1.5rem; height: 1.5rem; margin-left: .45rem; color: var(--ink-soft); border-radius: 50%;
              vertical-align: -.3rem; }
  .note-btn:hover, .note-btn:focus-visible { color: var(--live); background: var(--live-soft); outline: none; }

  dialog.note-dialog { border: none; border-radius: 14px; padding: 0; max-width: min(440px, 100% - 2.5rem);
    background: var(--field); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog.note-dialog::backdrop { background: rgba(10,14,18,.45); }
  .note-inner { padding: 1.4rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom)); }
  .note-inner h3 { margin: 0 0 .6rem; font-size: 1.1rem; font-weight: 600; padding-right: 1.6rem; }
  .note-inner p { margin: 0; font-size: .95rem; line-height: 1.55; color: var(--ink-soft); }
  .note-close { all: unset; position: absolute; top: .9rem; right: .9rem; cursor: pointer; width: 2rem; height: 2rem;
    display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--ink-soft); }
  .note-close:hover, .note-close:focus-visible { background: var(--live-soft); color: var(--live); outline: none; }

  .entry .aliases { margin: 1.4rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: .4rem .5rem; }
  .entry .aliases li { background: var(--live-soft); color: var(--live-ink); padding: .25rem .65rem; border-radius: 999px; font-size: .9rem; }
  .entry .aliases li.label { background: none; color: var(--ink-soft); padding-left: 0; }
  .entry .source { margin-top: 1.6rem; font-size: .8rem; color: var(--ink-soft); display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  .challenge { all: unset; cursor: pointer; font-size: .8rem; color: var(--live-ink); border: 1px solid currentColor; border-radius: 999px;
               padding: .3rem .7rem; display: inline-flex; align-items: center; gap: .35rem; min-height: 1.8rem; }
  .challenge:hover, .challenge:focus-visible { background: var(--live-soft); outline: none; }
  .challenge[data-reported] { color: var(--ink-soft); border-color: var(--line); cursor: default; background: none; }

  .empty { color: var(--ink-soft); line-height: 1.55; max-width: 62ch; }
  .empty strong { color: var(--ink); }
  .empty .pending { display: inline-block; margin-top: .6rem; }

  .suggest { margin: 0 0 0; list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
  .suggest li button { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 6px; padding: .55rem .8rem; font-size: .9rem; min-height: 2.4rem; display: inline-flex; align-items: center; }
  .suggest li button:hover, .suggest li button:focus-visible { border-color: var(--ink); outline: none; }

  footer { width: min(680px, 100% - 2.5rem); margin: 0 auto; padding: 1.5rem 0; font-size: .8rem; color: var(--ink-soft); text-align: center; }
  footer .version { font-size: .7rem; font-style: italic; opacity: .65; margin-left: .4rem; }

  @media (max-width: 520px) {
    main { padding-top: max(2.5rem, env(safe-area-inset-top) + 1rem); }
    h1.title { font-size: 1.4rem; }
    .subtitle { margin-bottom: 1.6rem; }
    .search { flex-wrap: wrap; border-radius: 14px; }
    .search input { flex: 1 1 0; font-size: 1.6rem; padding: .9rem 1rem; }
    .search .go { flex: 0 0 auto; padding: 0 .9rem; }
    .search select { flex: 1 1 100%; border-left: 0; border-top: 1.5px solid var(--line); padding: .8rem 1rem; max-width: none; }
    .entry .full { font-size: 1.4rem; }
    .entry .gist { font-size: 1.1rem; }
    footer { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    html, body, body::before, .search, .search select { transition: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .entry { animation: in .18s ease-out; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  }
</style>
</head>
<body>
<main>
  <h1 class="title">Abbrev Lookup</h1>
  <p class="subtitle">Type an abbreviation</p>

  <div class="search-wrap">
    <form class="search" id="form" autocomplete="off">
      <input id="q" type="text" placeholder="e.g. ADMS" aria-label="Abbreviation" spellcheck="false" autocapitalize="characters" autocorrect="off" enterkeyhint="search"
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
      <button type="submit" class="go" aria-label="Look up">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </button>
      <select id="sector" aria-label="Sector"></select>
    </form>
    <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
  </div>
  <p class="hint" id="hint"></p>

  <section id="result" aria-live="polite"></section>
</main>

<dialog id="note-dialog" class="note-dialog">
  <div class="note-inner">
    <button type="button" class="note-close" id="note-close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h3 id="note-title"></h3>
    <p id="note-body"></p>
  </div>
</dialog>
<footer>&copy; <span id="year"></span> Per Lasse Brønstad. All rights reserved. <span class="version" id="version"></span></footer>

<script>
  // ---- configuration --------------------------------------------------
  // One JSON file per sector in data/. Add a sector here and create its file.
  // Each sector carries its own theme: background, ink, accent and an optional
  // texture — any CSS background value. The scenes live in img/<id>.svg; a photo
  // or PNG works the same way: url("img/finance.jpg") center bottom / cover no-repeat.
  const SECTORS = [
    {
      id: "utilities",
      label: "Utilities",
      examples: ["ADMS", "FLISR", "DSO"],
      theme: {
        paper: "#eaf1f6",
        ink: "#1a2328",
        inkSoft: "#5a6870",
        line: "#c9d7de",
        field: "#f6fafc",
        live: "#d4880f",        // amber, the energised colour on a switchboard
        liveSoft: "#fbf1dd",
        liveInk: "#6b4406",
        texture: `url("img/utilities.svg") center bottom / max(1200px, 100%) auto no-repeat`,
      },
    },
    {
      id: "energy",
      label: "Energy",
      examples: ["FPSO", "PDO", "SIMOPS"],
      theme: {
        paper: "#1d2733",       // deep water
        ink: "#eef1f4",
        inkSoft: "#a3aeb9",
        line: "#3a4756",
        field: "#27333f",
        live: "#e8642a",        // flare orange
        liveSoft: "#4a2a1b",
        liveInk: "#ffc7ab",
        texture: `url("img/energy.svg") center bottom / max(1200px, 100%) auto no-repeat`,
      },
    },
    {
      id: "information-technology",
      label: "Information Technology",
      examples: ["API", "SIEM", "SSO"],
      theme: {
        paper: "#eef0fb",
        ink: "#1c2233",
        inkSoft: "#5b5f7a",
        line: "#d6d9f0",
        field: "#f7f8fd",
        live: "#0ea5b7",        // cyan/teal accent
        liveSoft: "#dff5f7",
        liveInk: "#0b6572",
        texture: `url("img/information-technology.svg") center bottom / max(1200px, 100%) auto no-repeat`,
      },
    },
    // Template for the next sector — copy, change the id/label/colours, create data/<id>.json:
    // { id: "finance", label: "Finance", examples: ["EBITDA"], theme: { paper: "#f6f4ef", ink: "#1f1c17", inkSoft: "#6a6357",
    //   line: "#d9d3c7", field: "#fffdf9", live: "#2f6f4f", liveSoft: "#e2efe7", liveInk: "#1d4a33", texture: "none" } },
  ];

  // Step 2: point this at your Cloudflare Worker / Vercel function.
  // It should accept POST { abbr, sector } and return { fullName, gist, description, aliases }.
  // Leave empty and the app is purely dictionary-based.
  const AI_ENDPOINT = "https://abbrev-api.vercel.app/api/lookup";

  // --- SIMULATION MODE ---------------------------------------------------
  // While true, a miss is answered with placeholder Lorem ipsum text instead
  // of a real network call, so the layout and flow can be reviewed before
  // step 2 (the real Vercel function) is wired up. Set to false, and set
  // AI_ENDPOINT above, to go live.
  // Google Apps Script Web App URL that logs a search miss to a Google Sheet
  // (see tools/miss-logger.gs). Leave empty to disable logging entirely.
  const MISS_LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbyN5cpI-6CP8DFg5qPfJn7J7GUbwWBowHKOoE1BFrT5PfbGC4FFm_8Mite8lVUXc3pT/exec";
  function logMiss(abbr, sector) {
    if (!MISS_LOG_ENDPOINT) return;
    // Fire-and-forget: never blocks the UI, and a failure here is silent —
    // logging is a nice-to-have, not something that should ever break lookup.
    // GET with query params, not POST with a body: Apps Script Web Apps answer
    // every request with a 302 redirect to script.googleusercontent.com, and
    // browsers turn a POST into a bodyless GET when following a 302 — so a
    // POST body silently never arrives. A GET has no body to lose.
    const qs = new URLSearchParams({ abbr, sector, page: location.href, ts: new Date().toISOString() });
    fetch(`${MISS_LOG_ENDPOINT}?${qs}`, { mode: "no-cors" }).catch(() => {});
  }

  const SIMULATE_AI = false;
  function simulateAiLookup(term) {
    return new Promise((resolve) => setTimeout(() => resolve({
      fullName: "Lorem Ipsum Dolor Sit Amet",
      gist: "Lorem ipsum dolor sit amet",
      description: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua, ut enim ad minim veniam.",
      aliases: ["Lorem Ipsum", "LI"],
    }), 2000)); // artificial delay so the "Asking AI…" state is visible
  }
  // ------------------------------------------------------------------------

  // ---- helpers --------------------------------------------------------
  const label = (id) => (SECTORS.find(d => d.id === id) || {}).label || id;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- theming --------------------------------------------------------
  const VAR_MAP = { paper: "--paper", ink: "--ink", inkSoft: "--ink-soft", line: "--line", field: "--field",
                    live: "--live", liveSoft: "--live-soft", liveInk: "--live-ink", texture: "--texture" };
  function applySector(id, animate) {
    renderHint(id);
    applyTheme(id, animate);
  }
  function renderHint(id) {
    const ex = (SECTORS.find(d => d.id === id) || {}).examples || [];
    $("#hint").innerHTML = ex.length
      ? `Press Enter, or try ${ex.map(e => `<button type="button" data-try="${esc(e)}">${esc(e)}</button>`).join(", ")}.`
      : "Press Enter.";
    $("#hint").querySelectorAll("[data-try]").forEach(b =>
      b.addEventListener("click", () => { input.value = b.dataset.try; lookup(); }));
  }
  function applyTheme(id, animate) {
    const theme = (SECTORS.find(d => d.id === id) || {}).theme || {};
    const root = document.documentElement.style;
    const set = () => {
      for (const [k, v] of Object.entries(VAR_MAP)) v && (theme[k] != null ? root.setProperty(v, theme[k]) : root.removeProperty(v));
      const meta = document.getElementById("theme-color-meta");
      if (meta && theme.paper) meta.setAttribute("content", theme.paper);
      document.body.classList.remove("switching");
    };
    if (!animate) return set();
    document.body.classList.add("switching");      // fade texture out…
    setTimeout(set, 250);                           // …swap colours mid-fade, texture fades back in
  }

  // ---- state ----------------------------------------------------------
  const dictionaries = {};           // sectorId -> { byAbbr: Map, byAlias: Map, entries: [] }
  let currentDict = null;             // preloaded dict for the active sector, for autocomplete
  function refreshCurrentDict() { loadSector(sectorSel.value).then(d => currentDict = d).catch(() => {}); }
  const $ = (sel) => document.querySelector(sel);
  const form = $("#form"), input = $("#q"), sectorSel = $("#sector"), result = $("#result");

  // ---- setup ----------------------------------------------------------
  for (const d of SECTORS) {
    const opt = document.createElement("option");
    opt.value = d.id; opt.textContent = d.label;
    sectorSel.appendChild(opt);
  }

  // Restore state from the URL so a lookup is shareable: ?s=utilities&q=ADMS
  const params = new URLSearchParams(location.search);
  if (params.get("s") && SECTORS.some(d => d.id === params.get("s"))) sectorSel.value = params.get("s");
  if (params.get("q")) { input.value = params.get("q"); lookup(); }

  applySector(sectorSel.value, false);
  refreshCurrentDict();
  // Only grab the keyboard automatically on devices with a real pointer (desktop).
  // On touch devices, popping the keyboard on load hides the sector choice and examples.
  if (matchMedia("(pointer: fine)").matches) input.focus();

  // Bump this by 0.001 on every change to this file (v0.001, v0.002, ...).
  const APP_VERSION = "v0.029";

  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("version").textContent = APP_VERSION;

  form.addEventListener("submit", (e) => { e.preventDefault(); lookup(); });
  // Belt and braces: some mobile keyboards send Enter without a submit event.
  // Enter selects a highlighted suggestion if there is one, otherwise runs a normal lookup.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (activeIndex >= 0 && suggestionMatches[activeIndex]) chooseSuggestion(suggestionMatches[activeIndex]);
      else lookup();
    } else if (e.key === "ArrowDown" && suggestionMatches.length) {
      e.preventDefault(); moveActive(1);
    } else if (e.key === "ArrowUp" && suggestionMatches.length) {
      e.preventDefault(); moveActive(-1);
    } else if (e.key === "Escape") {
      hideSuggestions();
    }
  });
  input.addEventListener("input", () => updateSuggestions());
  input.addEventListener("blur", () => setTimeout(hideSuggestions, 100));
  sectorSel.addEventListener("change", () => {
    applySector(sectorSel.value, true);
    input.value = ""; result.innerHTML = "";          // fresh start in the new sector
    hideSuggestions();
    refreshCurrentDict();
    history.replaceState(null, "", `?s=${encodeURIComponent(sectorSel.value)}`);
    if (matchMedia("(pointer: fine)").matches) input.focus();
  });

  // ---- autocomplete -----------------------------------------------------
  const suggestionsEl = $("#suggestions");
  let suggestionMatches = [];
  let activeIndex = -1;

  function updateSuggestions() {
    const raw = input.value.trim();
    if (!raw || !currentDict) { hideSuggestions(); return; }
    const key = norm(raw);
    suggestionMatches = currentDict.entries.filter(e =>
      norm(e.abbr).startsWith(key) || (e.aliases || []).some(a => norm(a).startsWith(key))
    ).slice(0, 6);
    activeIndex = -1;
    if (!suggestionMatches.length) { hideSuggestions(); return; }
    suggestionsEl.innerHTML = suggestionMatches.map((e, i) =>
      `<li role="presentation"><button type="button" role="option" id="sugg-${i}" data-i="${i}">
        <span class="s-abbr">${esc(e.abbr)}</span><span class="s-gist">${esc(e.gist || e.fullName)}</span>
      </button></li>`
    ).join("");
    suggestionsEl.hidden = false;
    input.setAttribute("aria-expanded", "true");
    suggestionsEl.querySelectorAll("[data-i]").forEach(b =>
      b.addEventListener("mousedown", (e) => { e.preventDefault(); chooseSuggestion(suggestionMatches[Number(b.dataset.i)]); }));
  }

  function moveActive(delta) {
    activeIndex = (activeIndex + delta + suggestionMatches.length) % suggestionMatches.length;
    suggestionsEl.querySelectorAll("button").forEach((b, i) => b.classList.toggle("active", i === activeIndex));
    input.setAttribute("aria-activedescendant", `sugg-${activeIndex}`);
  }

  function chooseSuggestion(entry) {
    input.value = entry.abbr;
    hideSuggestions();
    lookup();
  }

  function hideSuggestions() {
    suggestionMatches = []; activeIndex = -1;
    suggestionsEl.hidden = true; suggestionsEl.innerHTML = "";
    input.setAttribute("aria-expanded", "false");
    input.removeAttribute("aria-activedescendant");
  }

  // ---- data -----------------------------------------------------------
  async function loadSector(id) {
    if (dictionaries[id]) return dictionaries[id];
    const res = await fetch(`data/${id}.json`);
    if (!res.ok) throw new Error(`Could not load data/${id}.json (${res.status})`);
    const json = await res.json();
    const byAbbr = new Map(), byAlias = new Map();
    for (const e of json.entries) {
      byAbbr.set(norm(e.abbr), e);
      for (const a of e.aliases || []) byAlias.set(norm(a), e);
    }
    return (dictionaries[id] = { byAbbr, byAlias, entries: json.entries });
  }

  const norm = (s) => s.trim().toUpperCase().replace(/[\s.\-_/]/g, "");

  // ---- lookup ---------------------------------------------------------
  async function lookup() {
    const raw = input.value.trim();
    const sector = sectorSel.value;
    if (!raw) { result.innerHTML = ""; return; }
    hideSuggestions();

    // On touch devices, close the on-screen keyboard once a search runs so it
    // doesn't sit over the result. Desktop keeps focus (no keyboard to hide).
    if (!matchMedia("(pointer: fine)").matches) input.blur();

    history.replaceState(null, "", `?s=${encodeURIComponent(sector)}&q=${encodeURIComponent(raw)}`);

    let dict;
    try { dict = await loadSector(sector); }
    catch (err) { result.innerHTML = `<p class="empty">${esc(err.message)}. If you opened this file directly, serve the folder over HTTP instead.</p>`; return; }

    const key = norm(raw);
    const hit = dict.byAbbr.get(key) || dict.byAlias.get(key);
    if (hit) { render(hit, "dictionary", dict); return; }

    // Not in this sector's dictionary. Before asking AI to guess, check whether
    // it's simply a term that belongs to a different sector — no point letting
    // AI invent an Energy meaning for something that's already correctly
    // defined as a Utilities term. Still worth logging as missing from *this*
    // sector, since that's real signal about whether it belongs here too.
    logMiss(raw, sector);
    const elsewhere = [];
    for (const sec of SECTORS) {
      if (sec.id === sector) continue;
      let odict;
      try { odict = await loadSector(sec.id); } catch { continue; }
      if (odict.byAbbr.get(key) || odict.byAlias.get(key)) elsewhere.push(sec.id);
    }
    if (norm(input.value) !== key) return; // user moved on while we checked
    if (elsewhere.length) { renderElsewhere(raw, elsewhere); return; }

    // Genuinely unknown everywhere: show near matches, then try the AI fallback.
    askUnknown(raw, dict, key, sector);
  }

  async function askUnknown(raw, dict, key, sector) {
    const near = dict.entries.filter(e => norm(e.abbr).startsWith(key) || key.startsWith(norm(e.abbr))).slice(0, 6);
    const aiAvailable = SIMULATE_AI || Boolean(AI_ENDPOINT);
    renderMiss(raw, near, aiAvailable);
    if (!aiAvailable) return;
    try {
      const ai = SIMULATE_AI
        ? await simulateAiLookup(raw)
        : await fetch(AI_ENDPOINT, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ abbr: raw, sector }),
          }).then(res => { if (!res.ok) throw new Error(`AI lookup failed (${res.status})`); return res.json(); });
      // Guard against the user having typed something else while we waited.
      if (norm(input.value) !== key) return;
      render({ abbr: raw.toUpperCase(), ...ai }, "ai", dict);
    } catch (err) {
      renderMiss(raw, near, false, err.message);
    }
  }

  function renderElsewhere(raw, sectorIds) {
    result.innerHTML = `
      <div class="empty">
        <p><strong>${esc(raw.toUpperCase())}</strong> isn't a ${esc(label(sectorSel.value))} term — it's defined in
        ${sectorIds.map(id => esc(label(id))).join(" and ")}.</p>
        <ul class="suggest">
          ${sectorIds.map(id => `<li><button type="button" data-jump="${esc(id)}">View in ${esc(label(id))}</button></li>`).join("")}
          <li><button type="button" data-anyway>Look up an ${esc(label(sectorSel.value))} meaning anyway</button></li>
        </ul>
      </div>`;
    result.querySelectorAll("[data-jump]").forEach(b =>
      b.addEventListener("click", () => jumpToSector(b.dataset.jump, raw)));
    result.querySelector("[data-anyway]").addEventListener("click", async () => {
      const dict = await loadSector(sectorSel.value);
      askUnknown(raw, dict, norm(raw), sectorSel.value);
    });
  }

  function jumpToSector(sectorId, term) {
    sectorSel.value = sectorId;
    applySector(sectorId, true);
    input.value = term;
    lookup();
  }

  // ---- rendering ------------------------------------------------------
  function render(e, source, dict) {
    const aliases = (e.aliases || []).filter(Boolean);
    result.innerHTML = `
      <article class="entry">
        <h2 class="full">${esc(e.fullName)}</h2>
        <p class="abbr">${esc(e.abbr)}${e.note ? `<button type="button" class="note-btn" data-note aria-label="Good to know about ${esc(e.abbr)}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
            </button>` : ""}</p>
        ${e.gist ? `<p class="gist">${esc(e.gist)}</p>` : ""}
        <p class="desc">${linkifyAbbrs(e.description, dict, e.abbr)}</p>
        ${aliases.length ? `<ul class="aliases"><li class="label">Also called</li>${aliases.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
        <p class="source">
          ${source === "ai"
            ? "Generated by AI because this term isn't in the dictionary yet — verify before relying on it."
            : "From the curated dictionary."}
          ${source === "ai" ? `<button type="button" class="challenge" data-challenge
              data-sector="${esc(sectorSel.value)}" data-abbr="${esc(e.abbr)}"
              data-fullname="${esc(e.fullName)}" data-desc="${esc(e.description)}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
              Challenge
            </button>` : ""}
        </p>
      </article>`;
    if (source === "ai") result.querySelector("[data-challenge]").addEventListener("click", onChallenge);
    if (e.note) result.querySelector("[data-note]").addEventListener("click", () => openNote(e.abbr, e.note));
    result.querySelectorAll(".term-link").forEach(b =>
      b.addEventListener("click", () => { input.value = b.dataset.try; lookup(); }));
  }

  // Turn any other dictionary abbreviation mentioned in a description into a
  // clickable term, the same way the "try ADMS, FLISR…" hint works.
  function linkifyAbbrs(text, dict, selfAbbr) {
    const others = dict ? dict.entries.filter(e2 => e2.abbr !== selfAbbr).map(e2 => e2.abbr) : [];
    if (!others.length) return esc(text);
    const known = new Set(others);
    return text.split(/([A-Za-z][A-Za-z0-9&/]*)/g).map(part =>
      known.has(part)
        ? `<button type="button" class="term-link" data-try="${esc(part)}">${esc(part)}</button>`
        : esc(part)
    ).join("");
  }

  // ---- note popup ------------------------------------------------------
  const noteDialog = $("#note-dialog");
  function openNote(abbr, text) {
    $("#note-title").textContent = `${abbr} — good to know`;
    $("#note-body").textContent = text;
    noteDialog.showModal();
  }
  $("#note-close").addEventListener("click", () => noteDialog.close());
  noteDialog.addEventListener("click", (e) => {
    const r = noteDialog.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!inside) noteDialog.close();   // click landed on the backdrop
  });

  // What happens on a challenge isn't decided yet (no backend, no issue filing —
  // that comes later). For now this just acknowledges the click so the button
  // feels real; onChallenge is the one place to wire up real behaviour later.
  function onChallenge(e) {
    const b = e.currentTarget;
    b.setAttribute("data-reported", "");
    b.innerHTML = "Thanks for the feedback!";
  }

  function renderMiss(raw, near, aiPending, error) {
    result.innerHTML = `
      <div class="empty">
        <p><strong>${esc(raw.toUpperCase())}</strong> isn't in the ${esc(label(sectorSel.value))} dictionary yet.
        ${error ? `<br>${esc(error)}` : ""}
        ${aiPending ? `<br><span class="pending">Asking AI…</span>` : ""}</p>
        ${near.length ? `<p>Did you mean:</p><ul class="suggest">${near.map(e =>
          `<li><button type="button" data-go="${esc(e.abbr)}">${esc(e.abbr)}</button></li>`).join("")}</ul>` : ""}
      </div>`;
    result.querySelectorAll("[data-go]").forEach(b =>
      b.addEventListener("click", () => { input.value = b.dataset.go; lookup(); }));
  }

</script>
</body>
</html>
